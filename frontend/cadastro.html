<!DOCTYPE html>

<head>

    <title>cadastro</title>
</head>

<body>
    <div class="card">
        <h1>Cadastro</h1>

        <form method="">

            <label>E-mail:</label>

            <input type="password" placeholder="Digite sua senha">

            </button>
        </form>
    </div>
</body>
